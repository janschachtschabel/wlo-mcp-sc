      x-requires-env: WLO_AUTH_PRIVATE_KEY
      x-cors: wildcard
      security: []
      responses:
        '200': { $ref: '#/components/responses/ResourceMetadata' }
        '404': { $ref: '#/components/responses/OAuthOff' }
