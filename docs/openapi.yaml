        '429': { $ref: '#/components/responses/ConnectorRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /oauth/register:
    post:
      tags: [oauth]
      operationId: oauthRegister
      summary: Dynamic client registration (RFC 7591), open
      description: >-
        Public clients with PKCE only; no `client_secret` is issued. The
        `Content-Type` is not checked — the body must parse as a JSON object.
        Body cap 64 KiB (or `MAX_BODY_BYTES` if lower).
      x-requires-env: WLO_AUTH_PRIVATE_KEY
      x-cors: wildcard
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                redirect_uris:
                  description: Absolute https URLs (http only on localhost), no fragment.
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: uri }
                client_name:
                  description: Cut to 100 characters; `MCP-Client` when absent or empty.
                  type: string
              additionalProperties: true
      responses:
        '201':
          description: 'Registered. `Cache-Control: no-store`.'
          content:
            application/json:
              schema:
                type: object
                required: [client_id, client_name, redirect_uris, token_endpoint_auth_method, grant_types, response_types]
                properties:
                  client_id: { type: string }
                  client_name: { type: string }
                  redirect_uris: { type: array, items: { type: string } }
                  token_endpoint_auth_method: { const: none }
                  grant_types: { type: array, items: { const: authorization_code } }
                  response_types: { type: array, items: { const: code } }
        '400':
          description: '`invalid_client_metadata` (body is no JSON object) or `invalid_redirect_uri`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '404': { $ref: '#/components/responses/OAuthOff' }
        '405': { $ref: '#/components/responses/WrongMethod' }
        '413':
          description: '`invalid_client_metadata` — the body is too large.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429': { $ref: '#/components/responses/ConnectorRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /oauth/authorize:
    get:
      tags: [oauth]
      operationId: oauthAuthorizeShow
      summary: Check an authorization request, then show the consent page
      description: >-
        The request is checked before anyone is shown a password field, and a
        refused one is answered with a page — never with a redirect. With
        `Accept: application/json` the same URL answers what was recognised
        (the consent page's own fetch).
      x-requires-env: WLO_AUTH_PRIVATE_KEY
      x-cors: none
      security: []
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: response_type, in: query, required: true, schema: { const: code } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
        - { name: code_challenge_method, in: query, required: true, schema: { const: S256 } }
        - { name: state, in: query, schema: { type: string } }
        - name: Accept
          in: header
          description: Containing `application/json` selects the JSON answers.
          schema: { type: string }
      responses:
        '200':
          description: 'The consent page, or with `Accept: application/json` who is asking.'
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [client_name, redirect_uri]
                properties:
                  client_name: { type: string }
                  redirect_uri: { type: string }
        '400':
          description: 'The request was refused — a page, or `{error}` with `Accept: application/json`.'
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/OAuthOff' }
        '405': { $ref: '#/components/responses/WrongMethod' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [oauth]
      operationId: oauthAuthorizeGrant
      summary: Give consent — returns the redirect TARGET, not a redirect
      description: >-
        JSON only (`415` otherwise). The parameters are checked again. Either
        `token` (an access block whose login is then proven at the repository)
        or `anonymous: true` (a token that grants what a request without
        `Authorization` grants). An oversized or unreadable body answers `400`.
      x-requires-env: WLO_AUTH_PRIVATE_KEY
      x-cors: none
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri, response_type, code_challenge, code_challenge_method]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string }
                response_type: { const: code }
                code_challenge: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                code_challenge_method: { const: S256 }
                state: { type: string }
                token: { type: string, description: The access block. Required unless `anonymous` is `true`. }
                anonymous: { type: boolean }
              additionalProperties: true
      responses:
        '200':
          description: 'Where the page navigates next (carries `code` and `state`). `Cache-Control: no-store`.'
          content:
            application/json:
              schema:
                type: object
                required: [redirect]
                properties:
                  redirect: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/OAuthOff' }
        '405': { $ref: '#/components/responses/WrongMethod' }
        '415': { $ref: '#/components/responses/JsonRequired' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/UpstreamUnreachable' }
  /oauth/token:
    post:
      tags: [oauth]
      operationId: oauthToken
      summary: Exchange an authorization code for the access token
      description: >-
        The access token IS the access block. No `refresh_token`, no
        `expires_in`. The code is spent by the first attempt, whatever its
        outcome.
      x-requires-env: WLO_AUTH_PRIVATE_KEY
      x-cors: wildcard
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, code, client_id, redirect_uri, code_verifier]
              properties:
                grant_type: { const: authorization_code }
                code: { type: string }
                client_id: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string, minLength: 43, maxLength: 128 }
      responses:
        '200':
          description: 'The token. `Cache-Control: no-store`, `Pragma: no-cache`.'
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, scope]
                properties:
                  access_token: { type: string }
                  token_type: { const: Bearer }
                  scope: { const: wlo }
        '400':
          description: >-
            `invalid_request` (no body, or too large), `unsupported_grant_type`
            or `invalid_grant` (one text for every failed check).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '404': { $ref: '#/components/responses/OAuthOff' }
        '405': { $ref: '#/components/responses/WrongMethod' }
        '429': { $ref: '#/components/responses/ConnectorRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
