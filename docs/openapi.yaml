      summary: RFC 8414 authorization-server metadata
      x-requires-env: WLO_AUTH_PRIVATE_KEY
      x-cors: wildcard
      security: []
      responses:
        '200': { $ref: '#/components/responses/ServerMetadata' }
        '404': { $ref: '#/components/responses/OAuthOff' }
        '405': { $ref: '#/components/responses/WrongMethod' }
        '429': { $ref: '#/components/responses/ConnectorRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /.well-known/oauth-authorization-server/mcp:
