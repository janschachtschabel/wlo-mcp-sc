components:
  securitySchemes:
    accessBlock:
      type: http
      scheme: bearer
      description: >-
        A `wlo2.…` access block — pasted from `/auth`, obtained through OAuth
        (`/oauth/token`) or from `/auth/ticket`. Revocable at `/auth/revoke`.
    basic:
      type: http
      scheme: basic
      description: A WLO account's own login, forwarded to the repository.
    metricsToken:
      type: http
      scheme: bearer
      description: The operator's `METRICS_TOKEN` (at least 16 characters). Only for `/metrics`.
  headers:
    RetryAfter:
      description: Seconds to wait.
      schema: { type: integer, minimum: 0 }
    MetadataCache:
      description: Both discovery documents may be cached for five minutes.
      schema: { const: max-age=300 }
  parameters:
    ClientKey:
      name: X-WLO-Client-Key
      in: header
      description: A trusted client's key (`TRUSTED_CLIENT_KEYS`); selects its own budget instead of the address's.
      schema: { type: string }
    Q:
      name: q
      in: query
      description: The search term (alias `query`). Trimmed; at most 200 characters.
      schema: { type: string, maxLength: 200 }
    QueryAlias:
      name: query
      in: query
      description: >-
        Alias of `q`, read only when `q` is ABSENT. A `q` that is present
        but empty (`?q=&query=x`) wins, and `query` is then ignored.
      schema: { type: string, maxLength: 200 }
    SearchFormat:
      name: format
      in: query
      description: '`html` renders the same envelope as a self-contained page (`text/html`).'
      schema: { type: string, enum: [html] }
    Fields:
      name: fields
      in: query
      description: >-
        Comma-separated result fields to keep; `nodeId` is always kept.
        Unknown names are ignored; `400` when none is valid. Accepted:
        nodeId, title, description, keywords, disciplines,
        educationalContexts, userRoles, learningResourceTypes, url,
        downloadUrl, contentUrl, previewUrl, previewIsIcon, isPublic,
        contentsCount, mimeType, fileSize, license, publisher, nodeType,
        topicPageUrl, textContent, compendiumText, topicPageContent.
      schema: { type: string }
    IncludeFacets:
      name: includeFacets
      in: query
      schema: { $ref: '#/components/schemas/Flag' }
    EducationalContext:
      name: educationalContext
      in: query
      description: Vocabulary label or URI. An unknown value is reported in `unresolvedFilters`, not refused.
      schema: { type: string, maxLength: 100 }
    Discipline:
      name: discipline
      in: query
      schema: { type: string, maxLength: 100 }
    LearningResourceType:
      name: learningResourceType
      in: query
      schema: { type: string, maxLength: 100 }
    UserRole:
      name: userRole
      in: query
      schema: { type: string, maxLength: 100 }
    Publisher:
      name: publisher
      in: query
      schema: { type: string, maxLength: 100 }
    License:
      name: license
      in: query
      schema: { type: string, maxLength: 100 }
    MaxContent:
      name: maxContent
      in: query
      schema: { type: integer, minimum: 1, maximum: 25, default: 8 }
    MaxCollections:
      name: maxCollections
      in: query
      schema: { type: integer, minimum: 1, maximum: 25, default: 5 }
    SkipCount:
      name: skipCount
      in: query
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    Include:
      name: include
      in: query
      description: >-
        Comma-separated subset of `content`, `collections`, `topicPages`.
        Unknown entries are ignored; absent or all-unknown means all three.
      schema: { type: string }
    IncludeCompendium:
      name: includeCompendium
      in: query
      schema: { $ref: '#/components/schemas/Flag' }
    IncludeTextContent:
      name: includeTextContent
      in: query
      schema: { $ref: '#/components/schemas/Flag' }
    IncludeWikipedia:
      name: includeWikipedia
      in: query
      schema: { $ref: '#/components/schemas/Flag' }
    IncludeTopicPageContent:
      name: includeTopicPageContent
      in: query
      schema: { $ref: '#/components/schemas/Flag' }
    MaxPerSwimlane:
      name: maxPerSwimlane
      in: query
      schema: { type: integer, minimum: 1, maximum: 10, default: 3 }
  schemas:
    Error:
      description: >-
        The REST error shape. `code` and `retryAfter` are present on a `429`
        and on a `503` from a login check; a plain refusal carries `error`
        only. On `/auth*` and `/oauth/authorize` `error` is a German sentence
        for a person.
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          description: >-
            `rate_limited`, `too_many_logins`, `upstream_unreachable`,
            `origin_not_allowed`.
        retryAfter: { type: integer, description: Seconds; equals the `Retry-After` header. }
    UploadRefusal:
      description: '`/api/uploads` only: `error` is the code string itself.'
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: >-
            `method_not_allowed`, `rate_limited`, `too_many_logins`,
            `upstream_unreachable`, `login_required`, `octet_stream_required`,
            `too_large`, `unsupported_type`, `too_many`, `failed`, `timeout`.
        code: { type: string, description: Same as `error`, on the retryable refusals. }
        retryAfter: { type: integer }
    OAuthError:
      description: RFC 6749 §5.2 / RFC 7591 §3.2.2 error.
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }
    Flag:
      description: 'True for `1`, `true`, `yes`, `on` (case-insensitive); anything else is false.'
      type: string
    TokenBody:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, description: The access block. }
    Readiness:
      type: object
      required: [status, ok, upstream, checkedAt]
      properties:
        status: { enum: [ready, not_ready] }
        ok: { type: boolean }
        upstream: { enum: [ok, slow, unreachable] }
        checkedAt: { type: string, format: date-time }
        latencyMs: { type: integer }
        retryAfter:
          type: integer
          minimum: 1
          maximum: 30
          description: Present only when not ready. Seconds; equals the `Retry-After` header.
    AuthStatus:
      type: object
      required: [mode, authenticated, authority, credential, upstream]
      properties:
        mode: { enum: [anonymous, service, user] }
        authenticated: { type: boolean }
        configuredAs: { type: string }
        authority: { type: [string, 'null'] }
        displayName: { type: string }
        credential: { enum: [none, basic, access-block, ticket, service] }
        upstream:
          description: '`unreachable` = the repository gave no verdict; not a refused login.'
          enum: [ok, unreachable]
        expiresAt: { type: string, format: date-time }
    SearchEnvelope:
      description: >-
        Top-level keys as `handleSearch` writes them. With `fields` the result
        items are reduced; the items themselves are not specified here.
      type: object
      required: [query, content, collections, topicPages]
      properties:
        query: { type: string }
        content: { $ref: '#/components/schemas/SearchBucket' }
        collections: { $ref: '#/components/schemas/SearchBucket' }
        topicPages: { $ref: '#/components/schemas/SearchBucket' }
        wikipedia: { type: object, additionalProperties: true }
        warnings:
          description: Present on the guidance envelope of a request without a term.
          type: array
          items: { type: string }
        unresolvedFilters:
          description: Filters that did not resolve to a vocabulary URI.
          type: array
          items: {}
        facets:
          description: Only with `includeFacets` and when non-empty.
          type: object
          additionalProperties: true
      additionalProperties: true
    SearchBucket:
      type: object
      required: [total, count, results]
      properties:
        total: { type: integer }
        count: { type: integer }
        results:
          type: array
          items: { type: object, additionalProperties: true }
      additionalProperties: true
  responses:
    ServerMetadata:
      description: >-
        RFC 8414 authorization-server metadata, exactly the fields
        `authorizationServerMetadata` writes. `issuer` is the public origin
        (`WLO_PUBLIC_BASE_URL`, else the `Host` header under `TRUST_PROXY`).
      headers:
        Cache-Control: { $ref: '#/components/headers/MetadataCache' }
      content:
        application/json:
          schema:
            type: object
            required:
              - issuer
              - authorization_endpoint
              - token_endpoint
              - registration_endpoint
              - response_types_supported
              - grant_types_supported
              - code_challenge_methods_supported
              - token_endpoint_auth_methods_supported
              - scopes_supported
            properties:
              issuer: { type: string, format: uri }
              authorization_endpoint: { type: string, format: uri, description: '`<issuer>/oauth/authorize`' }
              token_endpoint: { type: string, format: uri, description: '`<issuer>/oauth/token`' }
              registration_endpoint: { type: string, format: uri, description: '`<issuer>/oauth/register`' }
              response_types_supported: { type: array, items: { const: code } }
              grant_types_supported: { type: array, items: { const: authorization_code } }
              code_challenge_methods_supported: { type: array, items: { const: S256 } }
              token_endpoint_auth_methods_supported: { type: array, items: { const: none } }
              scopes_supported: { type: array, items: { const: wlo } }
    ResourceMetadata:
      description: >-
        RFC 9728 protected-resource metadata, exactly the fields
        `protectedResourceMetadata` writes.
      headers:
        Cache-Control: { $ref: '#/components/headers/MetadataCache' }
      content:
        application/json:
          schema:
            type: object
            required: [resource, authorization_servers, scopes_supported, bearer_methods_supported]
            properties:
              resource: { type: string, format: uri, description: '`<issuer>/mcp`' }
              authorization_servers: { type: array, items: { type: string, format: uri }, description: The issuer, alone. }
              scopes_supported: { type: array, items: { const: wlo } }
              bearer_methods_supported: { type: array, items: { const: header } }
    SearchEnvelope:
      description: >-
        The envelope — or, with `format=html`, the same content as a page.
        `Cache-Control: no-store`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SearchEnvelope' }
        text/html:
          schema: { type: string }
    BadRequest:
      description: The request was refused; `error` says why.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UseGet:
      description: 'Method not allowed — GET only. (Static files add `Allow: GET`.)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    WrongMethod:
      description: Method not allowed; `Allow` names the accepted one(s).
      headers:
        Allow: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    JsonRequired:
      description: 'The body must be declared `Content-Type: application/json`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FeatureOff:
      description: Access blocks are not issued on this server (`WLO_AUTH_PRIVATE_KEY` unset or the registry unreadable).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OAuthOff:
      description: >-
        OAuth is not set up — no key material (`WLO_AUTH_PRIVATE_KEY`), or the
        public origin is unknown (`WLO_PUBLIC_BASE_URL` unset and no
        `TRUST_PROXY`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ApiRateLimited:
      description: >-
        `rate_limited` — `API_RATE_LIMIT_RPM` requests per minute and address
        (default 30). On a path that checks a login also `too_many_logins`
        (distinct logins per address in ten minutes).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConnectorRateLimited:
      description: '`rate_limited` — the connector budget, `RATE_LIMIT_RPM` per minute and address.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UpstreamUnreachable:
      description: >-
        `upstream_unreachable` — the repository did not answer the login
        check. No verdict on the login; retry once after `retryAfter` (10 s).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Internal failure; the reason is in the server log only.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Html:
      description: 'An HTML page with a Content-Security-Policy and `X-Content-Type-Options: nosniff`.'
      content:
        text/html:
          schema: { type: string }
    Asset:
      description: 'The file, with the content type named in the summary and `X-Content-Type-Options: nosniff`.'
      content:
        '*/*':
          schema: { type: string }
