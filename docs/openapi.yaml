openapi: 3.1.0
info:
  title: WLO MCP Server — HTTP surface outside MCP
  version: 1.1.0
  summary: Every path the server answers besides the MCP protocol itself.
  description: |
    Read from the source (`src/http-app.ts` and `src/rest/*`), not from a wish
    list. What `tests/openapi.test.ts` pins is narrower than that sentence:
    the PATHS agree both ways (a path the code compares against or lists in a
    route table is named here, and every path named here is one the code
    serves), and every `$ref` in this file resolves. Methods, parameters,
    status codes and schemas are NOT checked by any test — they were read from
    the code by hand and can drift.

    The MCP tools are NOT described here — `tools/list` on `POST /mcp` is their
    contract. `POST /mcp` appears as one path only.

    **Rules that hold for every path on the public port**

    - Every response carries `X-Request-Id`. A caller's own `X-Request-Id`
      request header is adopted when it is a plain token, otherwise one is made.
    - `OPTIONS` on any path answers `204` with no body (the CORS preflight).
    - A request target that cannot be parsed answers `400`
      `{"error": "Malformed request target"}`.
    - A path or method nothing owns answers `404`
      `{"error": "Not found. Use POST /mcp"}`.
    - A `429` carries `Retry-After` (seconds, the rest of the limiter's window)
      and repeats it as `retryAfter` in the body.

    **CORS.** Paths marked `x-cors: wildcard` send
    `Access-Control-Allow-Origin: *`, `Allow-Methods: POST, GET, OPTIONS`,
    `Allow-Headers: Content-Type, Accept, Mcp-Session-Id` and
    `Expose-Headers: X-Request-Id`. `Authorization` is deliberately not an
    allowed header. Paths marked `x-cors: none` send no CORS header at all:
    everything under `/auth*`, `/oauth/authorize` and `/api/uploads` (a
    credential is checked there, and the limiters count per client address).
    `/auth/ticket` is the one exception under `/auth*` (`x-cors: ticket`).
    The rule is a prefix match on `/auth`, so it also covers the static
    files `/auth.css`, `/auth.js`, `/auth-revoke.js`, `/auth-i18n.js` and
    `/authorize.js`.

    **Environment switches.** `x-requires-env` names the variable without
    which a path does not exist (it then answers `404`).

    **Internal port.** With `INTERNAL_PORT` set (and different from `PORT`) a
    second listener answers `GET /health`, `GET /ready` and `GET /metrics` and
    nothing else (`404 {"error": "Not found"}`, on a failure
    `500 {"error": "Internal error"}`). It sends no CORS headers and no
    `X-Request-Id`. There `/metrics` needs no token unless `METRICS_TOKEN` is
    configured. The same three paths stay on the public port.
servers:
  - url: http://localhost:3000
    description: Local server (`PORT`, default 3000)
tags:
  - name: mcp
    description: The MCP endpoint and the two status paths beside it.
  - name: operations
    description: Liveness, readiness, metrics.
  - name: rest
    description: Public read-only REST layer (`/api/*`), anonymous, GET only.
  - name: upload
    description: Batch upload slot (server-to-server).
  - name: access-block
    description: Access-block endpoints (`/auth*`).
  - name: oauth
    description: OAuth 2.1 surface and its discovery documents.
  - name: pages
    description: Static pages and their assets, from a fixed allow-list.
paths:
  /mcp:
    post:
      tags: [mcp]
      operationId: mcpPost
      summary: MCP endpoint (Streamable HTTP, stateless)
      description: |
        JSON-RPC 2.0 as defined by the Model Context Protocol
        (https://modelcontextprotocol.io/specification). The tools, their
        inputs and outputs are described by `tools/list`, not here.

        Without `Authorization` the request is served anonymously (or with the
        configured service account). A JSON-RPC batch may hold at most 10
        messages. The body is capped at `MAX_BODY_BYTES` (default 4 MiB). The
        optional `X-WLO-Client-Key` header selects a trusted client's own
        budget (`TRUSTED_CLIENT_KEYS`). Any other method on `/mcp` answers
        `405` with `Allow: POST`.
      x-cors: wildcard
      security:
        - {}
        - accessBlock: []
        - basic: []
      parameters:
        - $ref: '#/components/parameters/ClientKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: One JSON-RPC message, or an array of at most 10.
      responses:
        '200':
          description: >-
            JSON-RPC response — `application/json`, or `text/event-stream`
            when the server runs with `MCP_SSE`. Status and content type are
            the MCP SDK transport's; it can also answer other codes of its own
            (for example `202` for a notification).
        '400':
          description: Body is not JSON, or the batch exceeds 10 messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: >-
            A Bearer token was presented and cannot be used (invalid, revoked,
            foreign). `WWW-Authenticate` carries the OAuth `resource_metadata`
            pointer when the public origin is known.
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Body exceeds `MAX_BODY_BYTES`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: >-
            Protocol budget, tool budget or the distinct-login guard. The body
            is a JSON-RPC error (`error.code` -32029,
            `error.data = {code, retryAfter}` with `code` `rate_limited` or
            `too_many_logins`), not the REST shape.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '500':
          description: Request handling failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /:
    post:
      tags: [mcp]
      operationId: mcpPostRoot
      summary: MCP endpoint, same as `POST /mcp`
      description: For clients that append no path. Identical to `POST /mcp` in every respect.
      x-cors: wildcard
      security:
        - {}
        - accessBlock: []
        - basic: []
      responses:
        '200':
          description: See `POST /mcp` (all its status codes apply).
    get:
      tags: [pages]
      operationId: launcherRoot
      summary: Prompt launcher page (`launcher.html`)
      x-cors: wildcard
      security: []
      responses:
        '200': { $ref: '#/components/responses/Html' }
        '500': { $ref: '#/components/responses/InternalError' }
  /health:
    get:
      tags: [operations]
      operationId: health
      summary: Liveness — the process is up, and which build it is
      description: Says nothing about the repository (that is `/ready`). No budget.
      x-cors: wildcard
      security: []
      responses:
        '200':
          description: Always, while the process answers.
          content:
            application/json:
              schema:
                type: object
                required: [status, server, version, widgets]
                properties:
                  status: { const: ok }
                  server: { const: wlo-mcp }
                  version: { type: string }
                  widgets:
                    description: Widget build hashes (the deploy fingerprint).
                    type: object
                    additionalProperties: true
  /ready:
    get:
      tags: [operations]
      operationId: ready
      summary: Readiness — can the repository be reached?
      description: >-
        No budget; the repository is asked at most once per 30 s, and a probe
        that takes longer than 5 s counts as `slow`. `Cache-Control: no-store`.
      x-cors: wildcard
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: >-
            Not ready (`upstream` is `unreachable` or `slow`). `Retry-After` and
            `retryAfter` give the whole seconds until asking again can return a
            different answer: the rest of the 30 s the answer is held, counted
            from when it arrived (1 to 30); or 5 when the probe has not answered
            within 5 s and is still in flight — that `slow` answer is not held.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /metrics:
    get:
      tags: [operations]
      operationId: metrics
      summary: Prometheus metrics for the operator's scraper
      description: >-
        On the public port only when `METRICS_TOKEN` is set (at least 16
        characters), and then only to that token. On the internal port
        (`INTERNAL_PORT`) it answers without a token unless one is configured.
      x-requires-env: METRICS_TOKEN
      x-cors: wildcard
      security:
        - metricsToken: []
      responses:
        '200':
          description: 'Prometheus text exposition format 0.0.4. `Cache-Control: no-store`.'
          content:
            text/plain:
              schema: { type: string }
        '401':
          description: 'Missing or wrong token. `WWW-Authenticate: Bearer realm="metrics"`.'
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/status:
    get:
      tags: [mcp]
      operationId: authStatus
      summary: Login status in one request
      description: >-
        Same credential rules as `POST /mcp` — the caller's header, else the
        configured service account, else anonymous; a `Basic` header that
        cannot be parsed reads as anonymous. Spends the protocol budget (3 ×
        `RATE_LIMIT_RPM`, or a trusted client's own). The answer is cached
        60 s per presented header, 10 s when `upstream` is `unreachable`.
        Exists whether or not `WLO_AUTH_PRIVATE_KEY` is set.
      x-cors: none
      security:
        - {}
        - accessBlock: []
        - basic: []
      parameters:
        - $ref: '#/components/parameters/ClientKey'
      responses:
        '200':
          description: 'The status. `Cache-Control: no-store`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthStatus' }
        '401':
          description: A Bearer token was presented and cannot be used.
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Protocol budget (`rate_limited`) or distinct-login guard (`too_many_logins`).
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/search:
    get:
      tags: [rest]
      operationId: apiSearch
      summary: Search content, collections and topic pages in one call
      description: >-
        A MISSING search term answers `200` with an empty guidance envelope
        (`query: ""` plus `warnings`), not `400` — fetch layers that strip the
        query string would otherwise hit a dead end. Integer parameters are
        clamped into their range, never rejected; a non-numeric value falls
        back to the default.
      x-cors: wildcard
      security: []
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/QueryAlias'
        - $ref: '#/components/parameters/SearchFormat'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/IncludeFacets'
        - $ref: '#/components/parameters/EducationalContext'
        - $ref: '#/components/parameters/Discipline'
        - $ref: '#/components/parameters/LearningResourceType'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/Publisher'
        - $ref: '#/components/parameters/License'
        - $ref: '#/components/parameters/MaxContent'
        - $ref: '#/components/parameters/MaxCollections'
        - $ref: '#/components/parameters/SkipCount'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/IncludeCompendium'
        - $ref: '#/components/parameters/IncludeTextContent'
        - $ref: '#/components/parameters/IncludeWikipedia'
        - $ref: '#/components/parameters/IncludeTopicPageContent'
        - $ref: '#/components/parameters/MaxPerSwimlane'
      responses:
        '200': { $ref: '#/components/responses/SearchEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/UseGet' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/search/{term}:
    get:
      tags: [rest]
      operationId: apiSearchByPath
      summary: Search with the term in the path
      description: >-
        The stripping-proof form of `/api/search`: the percent-decoded path
        segment becomes `q` unless a non-empty `q` query parameter is present.
        The segment is everything after `/api/search/`, slashes included
        (`/api/search/a/b` searches for `a/b`). All other parameters as on
        `/api/search`. A malformed percent escape answers `400`.
      x-cors: wildcard
      security: []
      parameters:
        - name: term
          in: path
          required: true
          description: >-
            The search term, percent-encoded — the whole rest of the path, so
            it may contain slashes. At most 200 characters after trimming.
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/SearchFormat'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/IncludeFacets'
        - $ref: '#/components/parameters/EducationalContext'
        - $ref: '#/components/parameters/Discipline'
        - $ref: '#/components/parameters/LearningResourceType'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/Publisher'
        - $ref: '#/components/parameters/License'
        - $ref: '#/components/parameters/MaxContent'
        - $ref: '#/components/parameters/MaxCollections'
        - $ref: '#/components/parameters/SkipCount'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/IncludeCompendium'
        - $ref: '#/components/parameters/IncludeTextContent'
        - $ref: '#/components/parameters/IncludeWikipedia'
        - $ref: '#/components/parameters/IncludeTopicPageContent'
        - $ref: '#/components/parameters/MaxPerSwimlane'
      responses:
        '200': { $ref: '#/components/responses/SearchEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/UseGet' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/collection:
    get:
      tags: [rest]
      operationId: apiCollection
      summary: List or search the direct contents of one collection
      description: >-
        With `q` or any filter the collection's direct file children are
        matched locally (one bounded page, so the answer can be a sample —
        see `truncated`); without either the children are listed.
      x-cors: wildcard
      security: []
      parameters:
        - name: nodeId
          in: query
          description: >-
            The collection. Defaults to `WLO_SKILLS_COLLECTION_ID`; `400` when
            neither is given.
          schema: { type: string, maxLength: 50 }
        - name: q
          in: query
          description: Optional search term (alias `query`).
          schema: { type: string, maxLength: 200 }
        - $ref: '#/components/parameters/QueryAlias'
        - name: max
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/EducationalContext'
        - $ref: '#/components/parameters/Discipline'
        - $ref: '#/components/parameters/LearningResourceType'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/Publisher'
        - $ref: '#/components/parameters/License'
      responses:
        '200':
          description: The collection's contents.
          content:
            application/json:
              schema:
                type: object
                required: [collectionId, query, total, results]
                properties:
                  collectionId: { type: string }
                  query: { type: [string, 'null'] }
                  total: { type: integer }
                  truncated:
                    description: Only on the local-matching branch — the page read was a sample.
                    type: boolean
                  collectionTotal:
                    description: Only on the local-matching branch.
                    type: integer
                  licenseFilter:
                    description: Only when `license` was given.
                    type: object
                    properties:
                      checked: { type: integer }
                      kept: { type: integer }
                  results:
                    type: array
                    items:
                      description: >-
                        `nodeId`, `title`, `description`,
                        `learningResourceTypes`, `publisher`, `url`,
                        `downloadUrl` — reduced to the requested `fields`.
                      type: object
                      additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/UseGet' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/compendium:
    get:
      tags: [rest]
      operationId: apiCompendium
      summary: Compendium texts of up to 25 collections
      x-cors: wildcard
      security: []
      parameters:
        - name: ids
          in: query
          description: >-
            Comma-separated node ids — at least one, at most 25, each at most
            50 characters. Takes precedence over `nodeId`.
          schema: { type: string }
        - name: nodeId
          in: query
          description: A single node id, used when `ids` is absent.
          schema: { type: string, maxLength: 50 }
      responses:
        '200':
          description: One entry per id.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        nodeId: { type: string }
                        title: { type: string }
                        compendiumText: { type: [string, 'null'] }
                      additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/UseGet' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/topic-page:
    get:
      tags: [rest]
      operationId: apiTopicPage
      summary: Swimlanes of one topic page
      description: >-
        `collectionId` or `variantId` is required. When no variant or an empty
        configuration is found the answer is still `200`, with
        `swimlaneCount: 0`, `swimlanes: []` and a `reason`.
      x-cors: wildcard
      security: []
      parameters:
        - name: collectionId
          in: query
          schema: { type: string, maxLength: 50 }
        - name: variantId
          in: query
          schema: { type: string, maxLength: 50 }
        - name: targetGroup
          in: query
          schema: { type: string, enum: [teacher, learner, general] }
        - $ref: '#/components/parameters/MaxPerSwimlane'
      responses:
        '200':
          description: >-
            The page. The keys listed are the ones the empty case writes; the
            resolved case is produced by `resolveTopicPageSwimlanes` and is
            not enumerated here.
          content:
            application/json:
              schema:
                type: object
                properties:
                  variantId: { type: string }
                  collectionId: { type: [string, 'null'] }
                  variantTitle: { type: string }
                  collectionTitle: { type: string }
                  description: { type: string }
                  topicPageUrl: { type: [string, 'null'] }
                  swimlaneCount: { type: integer }
                  swimlanesTotal: { type: integer }
                  swimlanes: { type: array, items: { type: object, additionalProperties: true } }
                  reason: {}
                additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '405': { $ref: '#/components/responses/UseGet' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/wikipedia:
    get:
      tags: [rest]
      operationId: apiWikipedia
      summary: Wikipedia summary for a term
      x-cors: wildcard
      security: []
      parameters:
        - name: q
          in: query
          description: The term (alias `query`). Required.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/QueryAlias'
        - name: lang
          in: query
          description: Language code, lower-cased before the check.
          schema: { type: string, pattern: '^[a-z]{2,3}$', default: de }
        - name: sections
          in: query
          schema: { type: integer, minimum: 1, maximum: 3, default: 1 }
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title: { type: string }
                  extract: { type: string }
                  thumbnail: { type: string }
                additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Wikipedia has no article for the term.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '405': { $ref: '#/components/responses/UseGet' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: >-
            Wikipedia did not answer — `code: upstream_unreachable`, with
            `Retry-After` and `retryAfter` (an estimate, 10 s).
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/skills:
    get:
      tags: [rest]
      operationId: apiSkills
      summary: The launcher's built-in skill files
      description: >-
        A closed list shipped with the server (`public/skills/`), not the
        repository's skill records — those are the MCP tools `search_skill` /
        `get_skill`.
      x-cors: wildcard
      security: []
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills:
                    type: array
                    items:
                      type: object
                      required: [id, name, description, path]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        description: { type: string }
                        path: { type: string, description: '`/api/skills/<id>`' }
        '405': { $ref: '#/components/responses/UseGet' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/skills/{id}:
    get:
      tags: [rest]
      operationId: apiSkillRaw
      summary: Raw Markdown of one built-in skill
      x-cors: wildcard
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: An `id` from `/api/skills`, percent-encoded.
          schema: { type: string }
      responses:
        '200':
          description: The skill file.
          content:
            text/markdown:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Unknown id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '405': { $ref: '#/components/responses/UseGet' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/uploads:
    post:
      tags: [upload]
      operationId: apiUpload
      summary: Put one file of a batch into an upload slot
      description: >-
        Server-to-server. The raw bytes are held in memory until the batch
        tool files them by `ref`. Requires a PERSONAL login the repository
        confirms; none, the anonymous token, the service account or an
        unconfirmed login answer `403`. Spends the protocol budget before the
        login is looked at, and — because the path lies under `/api/` — is
        NOT on the `/api/*` address bucket while the switch is on. Every
        refusal answers with `Connection: close` — except the `405` for
        another method, which carries `Allow: POST` and leaves the connection
        open. In refusals `error` is a CODE string here.
      x-requires-env: WLO_BATCH_UPLOAD_ENABLED
      x-cors: none
      security:
        - accessBlock: []
        - basic: []
      parameters:
        - $ref: '#/components/parameters/ClientKey'
        - name: X-Upload-Name
          in: header
          description: >-
            The client's file name, URL-encoded (first 200 characters used).
            Only tells markdown from plain text; never stored or echoed.
          schema: { type: string }
        - name: Content-Length
          in: header
          description: When present and above the per-file limit the request is refused before the body is read.
          schema: { type: integer }
      requestBody:
        required: true
        description: >-
          The file's bytes, at most `UPLOAD_MAX_BYTES` (default 50 MB, at most
          100 MB). The whole body must arrive within
          `UPLOAD_REQUEST_TIMEOUT_MS` (default 25 s, at most 28 s).
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 'Stored. `Cache-Control: no-store`.'
          content:
            application/json:
              schema:
                type: object
                required: [ref, sha256, size, mimeType, ext]
                properties:
                  ref: { type: string }
                  sha256: { type: string }
                  size: { type: integer }
                  mimeType: { type: string }
                  ext: { type: string }
        '403':
          description: '`login_required` — no personal login the repository confirmed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadRefusal' }
        '405':
          description: '`method_not_allowed`.'
          headers:
            Allow: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadRefusal' }
        '408':
          description: '`timeout` — the body took longer than the upload deadline.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadRefusal' }
        '413':
          description: '`too_large` — by `Content-Length`, or when the stream passed the limit.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadRefusal' }
        '415':
          description: >-
            `octet_stream_required` (wrong `Content-Type`) or
            `unsupported_type` (the bytes are no accepted file type).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadRefusal' }
        '429':
          description: >-
            `rate_limited` (request budget) and `too_many_logins`
            (distinct-login guard) carry `code`, `retryAfter` and
            `Retry-After`; `too_many` (no free slot) carries `error` only.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadRefusal' }
        '500':
          description: '`failed` — the slot could not be written.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadRefusal' }
        '503':
          description: >-
            `upstream_unreachable` — the repository did not answer the login
            check; no verdict on the login. `Retry-After: 10`.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadRefusal' }
  /auth/public-key:
    get:
      tags: [access-block]
      operationId: authPublicKey
      summary: The public key the access-block page encrypts with
      x-requires-env: WLO_AUTH_PRIVATE_KEY
      x-cors: none
      security: []
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey: { type: string, description: PEM }
        '404': { $ref: '#/components/responses/FeatureOff' }
        '405': { $ref: '#/components/responses/WrongMethod' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/issue:
    post:
      tags: [access-block]
      operationId: authIssue
      summary: Verify a block's login and list its id
      description: >-
        The block is built in the browser (password encrypted against
        `/auth/public-key`). The login is proven at the repository before the
        id is put on the allow-list. Body cap 64 KiB (or `MAX_BODY_BYTES` if
        lower); an oversized or unreadable body answers `400`.
      x-requires-env: WLO_AUTH_PRIVATE_KEY
      x-cors: none
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenBody' }
      responses:
        '200':
          description: Listed.
          content:
            application/json:
              schema:
                type: object
                required: [ok, label]
                properties:
                  ok: { const: true }
                  label: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/FeatureOff' }
        '405': { $ref: '#/components/responses/WrongMethod' }
        '415': { $ref: '#/components/responses/JsonRequired' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/UpstreamUnreachable' }
  /auth/revoke:
    post:
      tags: [access-block]
      operationId: authRevoke
      summary: Revoke one access block
      description: >-
        Two forms. (1) The block as `Authorization: Bearer` with no body —
        always `200 {revoked}`, whatever the block's state. (2) The block as
        `token` in a JSON body — `400` when it cannot be opened, else
        `200 {revoked}`; `revoked` is `false` for an id that was not listed.
      x-requires-env: WLO_AUTH_PRIVATE_KEY
      x-cors: none
      security:
        - {}
        - accessBlock: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenBody' }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/FeatureOff' }
        '405': { $ref: '#/components/responses/WrongMethod' }
        '415': { $ref: '#/components/responses/JsonRequired' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [pages]
      operationId: authRevokePage
      summary: Revocation page (`auth-revoke.html`)
      description: Served whether or not the feature is configured.
      x-cors: none
      security: []
      responses:
        '200': { $ref: '#/components/responses/Html' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/revoke-all:
    post:
      tags: [access-block]
      operationId: authRevokeAll
      summary: Verify a login, then revoke every block of that account
      x-requires-env: WLO_AUTH_PRIVATE_KEY
      x-cors: none
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenBody' }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, description: How many ids were struck. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/FeatureOff' }
        '405': { $ref: '#/components/responses/WrongMethod' }
        '415': { $ref: '#/components/responses/JsonRequired' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/UpstreamUnreachable' }
  /auth/ticket:
    post:
      tags: [access-block]
      operationId: authTicket
      summary: Exchange an edu-sharing ticket for a ticket block
      description: >-
        For a widget embedded in an edu-sharing page. The ticket is proven at
        the repository and wrapped in an access block. Distinct tickets per
        address are bounded by `TICKET_CREDENTIAL_LIMIT`.

        CORS: the one path under `/auth*` that sends CORS headers — the
        wildcard, or with `TICKET_ALLOWED_ORIGINS` set only the request's own
        `Origin` when it is listed (plus `Vary: Origin`). With that list set a
        request from any other browser origin answers `403`; a request without
        `Origin` is never refused for it.
      x-requires-env: WLO_AUTH_PRIVATE_KEY
      x-cors: ticket
      security: []
      parameters:
        - name: Origin
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { type: string, minLength: 1 }
      responses:
        '200':
          description: The block.
          content:
            application/json:
              schema:
                type: object
                required: [ok, block, authority]
                properties:
                  ok: { const: true }
                  block: { type: string, description: Send as `Authorization` Bearer token. }
                  authority: { type: string }
                  displayName: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`code: origin_not_allowed`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/FeatureOff' }
        '405': { $ref: '#/components/responses/WrongMethod' }
        '415': { $ref: '#/components/responses/JsonRequired' }
        '429': { $ref: '#/components/responses/ApiRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/UpstreamUnreachable' }
  /.well-known/oauth-authorization-server:
    get:
      tags: [oauth]
