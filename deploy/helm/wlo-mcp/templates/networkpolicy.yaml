{{- if .Values.networkPolicy.enabled }}
{{- $ingressNs := required "networkPolicy.ingressNamespace is required when networkPolicy.enabled is true — the namespace of the ingress controller; the chart does not guess it, because a wrong name cuts the traffic silently" .Values.networkPolicy.ingressNamespace }}
{{- $monitoringNs := required "networkPolicy.monitoringNamespace is required when networkPolicy.enabled is true — the namespace of Prometheus; the chart does not guess it, because a wrong name makes the scrape fail silently" .Values.networkPolicy.monitoringNamespace }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wlo-mcp.fullname" . }}
  labels:
    {{- include "wlo-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wlo-mcp.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Public port: the ingress controller only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ingressNs | quote }}
      ports:
        - port: http
          protocol: TCP
    # Internal port: the metrics scraper only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $monitoringNs | quote }}
      ports:
        - port: internal
          protocol: TCP
    {{- with .Values.networkPolicy.probeSourceCIDRs }}
    # Kubelet probes (liveness → internal, readiness → public). Most CNIs admit
    # traffic from the pod's own node regardless of policy; this rule is for the
    # ones that do not.
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
        - port: internal
          protocol: TCP
    {{- end }}
  egress:
    # DNS.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS: the repository, Wikipedia, the optional text-extraction service.
    # HONEST LIMIT: a plain NetworkPolicy cannot restrict by host name. With the
    # default (0.0.0.0/0 and ::/0) this is "any HTTPS destination"; narrowing it needs
    # stable CIDRs or a CNI-specific FQDN policy.
    - to:
        {{- range .Values.networkPolicy.egress.httpsCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
