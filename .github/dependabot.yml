# Dependency and base-image updates (audit 2026-11-12, X-1).
#
# Weekly, grouped, so a quiet repository gets one pull request per ecosystem
# rather than one per package. CI runs on each — the image build and its smoke
# test included — so an update that breaks the start is caught there.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    # Major versions are a decision, not a routine update: TypeScript 7 broke the
    # build (2026-11-14), and the Node typings must match the runtime we ship
    # (Node 22, see the Docker image and `engines`). Minor and patch still come.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  # The Dockerfile pins the base image by digest; this is what moves the pin.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The runtime stays on the LTS line (22): a new major is moved by hand,
    # together with `engines` and the CI's node-version. The digest still moves.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
